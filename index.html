<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Architect soak progress</title>
<meta name="description" content="How Hospital Architect's simulated reference hospital fares from version to version.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* The game's Clinical Light and Clinical Dark colours. Built by Tools/Workbench/soak_site.py in the game's repository. */
:root{
  --bg:#EEF3F4; --panel:#FFFFFF; --inset:#EEF3F4; --inset2:#E2EAEC; --line:#D5E0E2;
  --ink:#16262B; --ink2:#4E6268; --ink3:#6B7E83;
  --accent:#0A7F86; --accent-soft:#E0F2F1; --accent-soft-ink:#075E63; --on-accent:#FFFFFF;
  --good:#E3F4EA; --good-ink:#1E5E3A; --warn:#FDEBD0; --warn-ink:#7A4300; --bad:#FDECEA; --bad-ink:#8C1D18;
  --shadow:0 1px 2px rgba(16,38,43,.06),0 6px 24px rgba(16,38,43,.08);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
  --f:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --panel:#172128; --inset:#24323C; --inset2:#2D3D48; --line:#2F404B; --ink:#E6EEF0; --ink2:#A9BAC0; --ink3:#8A9DA3;
  --accent:#3DBDC3; --accent-soft:#133F44; --accent-soft-ink:#8EE0E3; --on-accent:#04282B;
  --good:#173325; --good-ink:#A4E4C1; --warn:#3C2B12; --warn-ink:#F7D398; --bad:#3E1D1B; --bad-ink:#FFC4BE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#0ca30c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --panel:#172128; --inset:#24323C; --inset2:#2D3D48; --line:#2F404B; --ink:#E6EEF0; --ink2:#A9BAC0; --ink3:#8A9DA3;
  --accent:#3DBDC3; --accent-soft:#133F44; --accent-soft-ink:#8EE0E3; --on-accent:#04282B;
  --good:#173325; --good-ink:#A4E4C1; --warn:#3C2B12; --warn-ink:#F7D398; --bad:#3E1D1B; --bad-ink:#FFC4BE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#0ca30c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.top{background:var(--accent);color:var(--on-accent)}
.top-in{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 18px max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.top h1{font-size:28px;font-weight:800}
.top p{margin:0;max-width:80ch;opacity:.92}
.top .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18)}
.grow{flex:1}
.theme{border:0;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.18);color:var(--on-accent);cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tab{border:0;font:inherit;font-weight:700;font-size:13.5px;padding:6px 15px;border-radius:999px;background:rgba(255,255,255,.16);color:var(--on-accent);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:12px;min-width:0}
.muted{color:var(--ink2);font-size:13.5px} .hint{color:var(--ink3);font-size:12.5px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--inset);color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
td .chip{white-space:nowrap}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--inset);color:var(--ink2);white-space:nowrap}
.tag.good{background:var(--good);color:var(--good-ink)} .tag.warn{background:var(--warn);color:var(--warn-ink)} .tag.bad{background:var(--bad);color:var(--bad-ink)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--inset);border:1px solid transparent;border-radius:10px;padding:7px 10px;max-width:100%}
select:focus{outline:none;border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.key{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:4px;border-radius:2px;display:inline-block}
.chart{position:relative;min-height:300px}
.chart svg{display:block;max-width:100%}
.grid{stroke:var(--line);stroke-width:1} .tick{fill:var(--ink3);font-size:11px;font-family:var(--f);font-variant-numeric:tabular-nums}
.cross{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12.5px;display:grid;gap:3px;min-width:160px;pointer-events:none}
.tip[hidden]{display:none}
.tiprow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center} .tiprow b{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg{color:var(--ink3);font-size:12px;margin-left:6px}
.drift{background:var(--warn);color:var(--warn-ink)} .drift .chg{color:var(--warn-ink)}
.dl{margin-left:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
details.step{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px}
details.step summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;font-weight:800;font-size:15px}
details.step[open] summary{margin-bottom:12px}
.seed{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:var(--inset);font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.runs{display:flex;flex-wrap:wrap;gap:6px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--ink3);font-size:12.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="bar"><span class="eyebrow">Hospital Architect</span><div class="grow"></div><button class="theme" id="theme" type="button" aria-label="Switch between light and dark"></button></div>
  <h1 id="title">Soak progress</h1>
  <p id="intro"></p>
  <div class="row" id="meta"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main id="view"><div class="panel"><div class="bar"><span class="spin"></span> Loading…</div></div></main>
<footer id="foot"></footer>
<script src="site.js"></script>
</body>
</html>
